name: weekly-leads

on:
  schedule:
    - cron: "0 6 * * 1" # lundi 06:00 UTC = 7h/8h Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency: leadplan

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest -q test_leadplan
      - run: python leadplan.py
        env:
          API_KEY_GOOGLE_CLOUD: ${{ secrets.API_KEY_GOOGLE_CLOUD }}
          APP_PASSWORD_GOOGLE: ${{ secrets.APP_PASSWORD_GOOGLE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          git push
